spring.application.name=security-tutoring

# simple way to remember a db url is :
# "protocol:driver://hosted-at:port-number/db_name" ->
# "jdbc:mysql://localhost:3306/security_db
spring.datasource.url=jdbc:mysql://localhost:3306/security_dbs
spring-datasource.username=
spring.datasource.password=

# spring knows that we are using mysql from the url we entered so no need for the driver property
spring.jpa.database=mysql
# this tells spring to create a new database at every run then delete after the run
spring.jpa.hibernate.ddl-auto=create-drop
# this shows what queries are being performed by jpa
spring.jpa.show-sql=true
